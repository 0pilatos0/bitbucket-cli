name: Feature Request
description: Suggest a new command, flag, or improvement.
title: '[Feature]: '
labels: ['enhancement', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! The more context you can give
        about the *use case* (not just the implementation), the better.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I have searched [existing issues and discussions](https://github.com/0pilatos0/bitbucket-cli/issues?q=is%3Aissue) for similar requests.
          required: true
        - label: I have checked the [docs](https://bitbucket-cli.paulvanderlei.com) and confirmed this functionality does not already exist.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do? What is the user-facing pain point?
      placeholder: When scripting against Bitbucket I need to ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the command, flag, or behavior you would like. If applicable, sketch the CLI surface (e.g. `bb pr list --reviewer <user>`).
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you've tried, related tools (`gh`, raw API, etc.), or other designs you ruled out.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Links to Bitbucket API docs, screenshots, prior art from `gh`, or anything else relevant.
