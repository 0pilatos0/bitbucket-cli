name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_only:
        description: 'Skip the release stage and publish package.json version directly to npm'
        type: boolean
        default: false

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    if: github.event_name != 'workflow_dispatch' || inputs.publish_only != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Check for changesets
        id: changesets
        run: |
          CHANGESETS=$(ls .changeset/*.md 2>/dev/null | grep -v README.md | wc -l | tr -d ' ')
          if [ "$CHANGESETS" -gt 0 ]; then
            echo "has_changesets=true" >> $GITHUB_OUTPUT
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release Pull Request
        if: steps.changesets.outputs.has_changesets == 'true'
        uses: changesets/action@v1
        with:
          version: bun run version
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get package version
        if: steps.changesets.outputs.has_changesets == 'false'
        id: package
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        if: steps.changesets.outputs.has_changesets == 'false'
        id: tag
        run: |
          if git ls-remote --tags origin "v${{ steps.package.outputs.version }}" | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to GitHub Packages
        if: steps.changesets.outputs.has_changesets == 'false' && steps.tag.outputs.exists == 'false'
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > .npmrc
          echo "@0pilatos0:registry=https://npm.pkg.github.com" >> .npmrc
          npm pkg set name="@0pilatos0/bitbucket-cli"
          npm publish --registry=https://npm.pkg.github.com --access public || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Git Tag
        if: steps.changesets.outputs.has_changesets == 'false' && steps.tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.package.outputs.version }}" -m "Release v${{ steps.package.outputs.version }}"
          git push origin "v${{ steps.package.outputs.version }}"

      - name: Create GitHub Release
        if: steps.changesets.outputs.has_changesets == 'false' && steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set publish flag
        if: steps.changesets.outputs.has_changesets == 'false' && steps.tag.outputs.exists == 'false'
        id: publish
        run: echo "should_publish=true" >> $GITHUB_OUTPUT

    outputs:
      should_publish: ${{ steps.publish.outputs.should_publish }}

  # Single npm publish job. Runs inline (no workflow_call) so that npm's
  # Trusted Publisher OIDC check sees `release.yml` as job_workflow_ref —
  # matching the npmjs.com trusted-publisher configuration for this package.
  #
  # Triggers:
  #   - automatic: after `release` creates the git tag and sets should_publish
  #   - manual:    `gh workflow run "Release" --ref main -f publish_only=true`
  #                (ships whatever version is currently in package.json; use
  #                 this to re-publish a version that already has a git tag)
  publish:
    name: Publish to npm
    needs: [release]
    if: |
      always() &&
      (needs.release.result == 'success' || needs.release.result == 'skipped') &&
      (
        needs.release.outputs.should_publish == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_only == true)
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun test
        env:
          NODE_ENV: test

      - name: Publish to npm
        run: npm publish --provenance --access public
