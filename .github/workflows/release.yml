name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_only:
        description: 'Skip the release stage and publish package.json version directly to npm'
        type: boolean
        default: false

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  BUN_VERSION: 1.3.14

jobs:
  release:
    name: Release
    if: github.event_name != 'workflow_dispatch' || inputs.publish_only != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock*') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Check for changesets
        id: changesets
        run: |
          CHANGESETS=$(ls .changeset/*.md 2>/dev/null | grep -v README.md | wc -l | tr -d ' ')
          if [ "$CHANGESETS" -gt 0 ]; then
            echo "has_changesets=true" >> $GITHUB_OUTPUT
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release Pull Request
        if: steps.changesets.outputs.has_changesets == 'true'
        uses: changesets/action@6a0a831ff30acef54f2c6aa1cbbc1096b066edaf # v1
        with:
          version: bun run version
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get package version
        if: steps.changesets.outputs.has_changesets == 'false'
        id: package
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        if: steps.changesets.outputs.has_changesets == 'false'
        id: tag
        run: |
          if git ls-remote --tags origin "v${{ steps.package.outputs.version }}" | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to GitHub Packages
        if: steps.changesets.outputs.has_changesets == 'false' && steps.tag.outputs.exists == 'false'
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > .npmrc
          echo "@0pilatos0:registry=https://npm.pkg.github.com" >> .npmrc
          npm pkg set name="@0pilatos0/bitbucket-cli"
          npm publish --registry=https://npm.pkg.github.com --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Git Tag
        if: steps.changesets.outputs.has_changesets == 'false' && steps.tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.package.outputs.version }}" -m "Release v${{ steps.package.outputs.version }}"
          git push origin "v${{ steps.package.outputs.version }}"

      - name: Create GitHub Release
        if: steps.changesets.outputs.has_changesets == 'false' && steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.package.outputs.version }}
          generate_release_notes: true
          # Published by release-binaries once the binaries are attached, so
          # releases/latest never points at a release without its assets.
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set publish flag
        if: steps.changesets.outputs.has_changesets == 'false' && steps.tag.outputs.exists == 'false'
        id: publish
        run: echo "should_publish=true" >> $GITHUB_OUTPUT

    outputs:
      should_publish: ${{ steps.publish.outputs.should_publish }}
      version: ${{ steps.package.outputs.version }}

  # Standalone executables with the Bun runtime embedded, for machines without
  # Bun. Each target compiles and is smoke-tested on its native runner, so a
  # binary that cannot start, load the embedded jq wasm or answer completion
  # never reaches the release.
  binaries:
    name: Compile ${{ matrix.target }}
    needs: [release]
    if: needs.release.outputs.should_publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            runner: ubuntu-latest
            asset: bb-linux-x64
          - target: bun-linux-arm64
            runner: ubuntu-24.04-arm
            asset: bb-linux-arm64
          - target: bun-darwin-x64
            runner: macos-15-intel
            asset: bb-darwin-x64
          - target: bun-darwin-arm64
            runner: macos-latest
            asset: bb-darwin-arm64
          - target: bun-windows-x64
            runner: windows-latest
            asset: bb-windows-x64.exe
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock*') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile
        run: bun scripts/compile.ts --target ${{ matrix.target }}

      # Bundled CommonJS keeps the build machine's __dirname, so a dependency
      # that reads files next to itself only works while node_modules exists.
      - name: Remove node_modules
        shell: bash
        run: rm -rf node_modules

      # SHELL pins tabtab's bash output format (bare names, no descriptions).
      - name: Smoke test
        shell: bash
        env:
          BIN: dist-bin/${{ matrix.asset }}
          VERSION: ${{ needs.release.outputs.version }}
          CI: '1'
          SHELL: /bin/bash
        run: |
          test "$("$BIN" --version | tr -d '\r')" = "$VERSION"
          test "$("$BIN" config list --json --jq '.configPath | type' | tr -d '\r')" = '"string"'
          COMP_LINE='bb pr ' COMP_POINT=6 COMP_CWORD=2 "$BIN" completion -- bb pr '' | tr -d '\r' | grep -x create >/dev/null
          test "$(grep -ao 'begin-{pkgname}-completion' "$BIN" | wc -l | tr -d ' ')" = 3

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist-bin/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  # Checksums and Sigstore build-provenance attestations for the binaries, so
  # installers and package formulas can pin and verify them. Publishing the
  # draft release is the last step.
  release-binaries:
    name: Attach binaries to release
    needs: [release, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bb-*
          path: dist-bin
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist-bin
        run: sha256sum bb-* > SHA256SUMS && cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist-bin/SHA256SUMS

      - name: Upload to GitHub Release and publish it
        run: |
          gh release upload "$TAG" dist-bin/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.release.outputs.version }}

  # Single npm publish job. Runs inline (no workflow_call) so that npm's
  # Trusted Publisher OIDC check sees `release.yml` as job_workflow_ref —
  # matching the npmjs.com trusted-publisher configuration for this package.
  #
  # Triggers:
  #   - automatic: after `release` creates the git tag and sets should_publish
  #   - manual:    `gh workflow run "Release" --ref main -f publish_only=true`
  #                (ships whatever version is currently in package.json; use
  #                 this to re-publish a version that already has a git tag)
  publish:
    name: Publish to npm
    needs: [release]
    if: |
      always() &&
      (needs.release.result == 'success' || needs.release.result == 'skipped') &&
      (
        needs.release.outputs.should_publish == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_only == true)
      )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock*') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun test
        env:
          NODE_ENV: test

      - name: Publish to npm
        run: npm publish --provenance --access public
