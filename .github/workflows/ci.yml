name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock*') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Lint docs (error codes & env vars)
        run: bun run lint:docs

      - name: Check formatting
        run: bun run format:check

  api-contract:
    name: API client contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # The pinned generator version and its output are byte-stable, but the
      # JDK must be hermetic too: runner-image Java can drift between
      # ubuntu-latest image updates (issue #266).
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock*') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # The generator jar (~95 MB) is fetched from Maven Central on first
      # generate, not by bun install; cache it in its storageDir
      # (openapitools.json) so every PR does not pay the download.
      - name: Cache OpenAPI generator jar
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/openapi-generator
          key: ${{ runner.os }}-openapi-generator-${{ hashFiles('openapitools.json', 'bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Regenerates src/generated/ from the pinned spec and fails when the
      # committed client differs (issue #266).
      - name: Check generated client matches the pinned spec
        run: bun run check:api-contract

  test:
    name: Test & build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock*') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: bun test

      # Linux leg measures coverage and fails the build under the bunfig.toml
      # threshold (the hard gate). Kept Linux-only to keep the matrix fast.
      - name: Test (coverage)
        if: matrix.os == 'ubuntu-latest'
        run: bun run test:coverage

      - name: Build
        run: bun run build

      - name: Verify build output
        shell: bash
        run: |
          test -f dist/index.js || (echo "Build output missing" && exit 1)
          test -f dist/build/jq.wasm || (echo "jq-wasm runtime missing (issue #309)" && exit 1)
          # Size gate: the generated API client regrows when the pinned spec
          # updates (check:api-updates), which silently inflates the tarball.
          # 1.5 MB leaves headroom above the current 0.91 MB minified bundle.
          test $(wc -c < dist/index.js) -lt 1572864 || (echo "dist/index.js exceeds the 1.5 MB size gate" && exit 1)

      # Reporting only — the Bun threshold above is the gate. Non-blocking so a
      # missing CODECOV_TOKEN never fails CI (add it as a repo secret to enable).
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # The npm package promises the Bun floor in package.json engines.bun. Build
  # the bundle with the pinned Bun, as release.yml does, then run it on exactly
  # that floor. The pinned Bun also installs: older Bun cannot read bun.lock.
  min-bun:
    name: Minimum Bun (engines.bun)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # no-cache: both setup steps write ~/.bun/bin/bun, so this step's post
      # step would save the minimum Bun under the pinned version's cache key.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Read minimum Bun
        id: min
        run: echo "version=$(jq -r '.engines.bun | ltrimstr(">=")' package.json)" >> "$GITHUB_OUTPUT"

      - name: Setup minimum Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.min.outputs.version }}

      - name: Run built CLI on minimum Bun
        env:
          MIN_BUN: ${{ steps.min.outputs.version }}
          HOME: ${{ runner.temp }}/home
        run: |
          test "$(bun --version)" = "$MIN_BUN"
          bun dist/index.js --version
          bun dist/index.js config list --json --jq 'keys' | grep -q configPath

  # Every release target, compiled and smoke-tested on its native runner (the
  # same runners as release.yml's binaries job), so a target-specific failure
  # shows up before a release.
  compile-smoke:
    name: Compile smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock*') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Keep the downloaded runtime on the workspace volume. Bun 1.3.14
      # failed when moving it across volumes on Windows (oven-sh/bun#43446).
      - name: Compile and smoke test
        run: bun test tests/compile.smoke.test.ts
        env:
          COMPILE_SMOKE: '1'
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-runtimes
