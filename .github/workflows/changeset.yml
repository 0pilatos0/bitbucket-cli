name: Changeset

on:
  pull_request:
    branches: [main]
    # labeled/unlabeled re-run the check when `no-changeset` is toggled.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Dispatched by release.yml for the release PR; compares against main.
  workflow_dispatch: {}

concurrency:
  group: changeset-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Changeset check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Check changesets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
          SKIP_REQUIRED: ${{ contains(github.event.pull_request.labels.*.name, 'no-changeset') && '--skip-required' || '' }}
        run: bun scripts/check-changeset.ts "$BASE_SHA" $SKIP_REQUIRED
