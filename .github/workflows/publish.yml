name: Publish to npm

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (for manual trigger)'
        required: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun test
        env:
          NODE_ENV: test

      - name: Publish to npm
        run: npm publish --provenance --access public
