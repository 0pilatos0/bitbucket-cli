name: Security audit

on:
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit (${{ matrix.directory }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory: ['.', 'docs']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Audit locked dependencies
        working-directory: ${{ matrix.directory }}
        run: bun audit
