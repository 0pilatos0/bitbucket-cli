name: Check Bitbucket API spec updates

on:
  schedule:
    # Weekly on Monday 06:00 UTC; run manually with workflow_dispatch too.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Check for upstream spec updates
        id: check
        run: |
          set +e
          bun run check:api-updates
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Fail on unverifiable check
        if: steps.check.outputs.exit_code == '2'
        run: |
          echo "::error::Could not verify the Bitbucket API spec (network failure or missing pin)."
          exit 1

      - name: Open issue when an update is available
        if: steps.check.outputs.exit_code == '1'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = 'Bitbucket Cloud API spec update available';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
            });
            if (issues.some((issue) => issue.title === title)) {
              console.log('Issue already open, skipping.');
              return;
            }
            await github.rest.issues.create({
              owner,
              repo,
              title,
              body: [
                'The pinned Bitbucket Cloud OpenAPI spec (`specs/bitbucket-cloud.json`) differs from upstream.',
                '',
                'Run `bun run update:api`, review the generated diff (request-body renames, removed/added endpoints, model changes), update command call sites and tests if needed, and commit.',
                '',
                'Verify with `bun run check:api-updates` before closing this issue.',
              ].join('\n'),
            });
